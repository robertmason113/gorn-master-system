function renderHome(q='') {

  const recentCards=recent.map(id=>cards.find(c=>c.id===id)).filter(Boolean);
  const quickData=(favCards.length?favCards:recentCards.length?recentCards:cards.slice(0,4)).slice(0,4);

  $('#list').innerHTML=filtered.map(c=>`<div class="row" onclick="openCard('${c.id}')"><div class="left"><div class="icon">${c.icon}</div><div><div class="name">${c.title}</div><div class="category">${c.category}</div></div></div><div class="star ${favorites.includes(c.id)?'on':''}" onclick="event.stopPropagation();toggleFav('${c.id}')">${favorites.includes(c.id)?'★':'☆'}</div></div>`).join('');

}

async function copyBlock(id,btn) {
  const text=document.getElementById(id).innerText;
  try{await navigator.clipboard.writeText(text);}
  catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  const old=btn.textContent;btn.textContent='✓ Скопировано';btn.classList.add('done');setTimeout(()=>{btn.textContent=old;btn.classList.remove('done')},1200);
}
$('#search').addEventListener('input',e=>renderHome(e.target.value));
renderHome();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('service-worker.js');
